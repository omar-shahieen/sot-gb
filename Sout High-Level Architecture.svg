<text x="120" y="351" fill="#5B6B78" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif" ><tspan x="120" dy="0">8-channel EMG stream</tspan><tspan x="120" dy="22.5">battery + contact status</tspan></text>
