<text x="802" y="300" fill="#0B7A83" font-size="23" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="802" dy="0">Accessible app UI</tspan></text>
<text x="802" y="331" fill="#5B6B78" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif" ><tspan x="802" dy="0">Preview / confirm • Arabic TTS</tspan><tspan x="802" dy="21.25">large text • vibration</tspan></text>
<text x="452" y="471" fill="#0B7A83" font-size="23" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="452" dy="0">Mode selector</tspan></text>
<text x="452" y="501" fill="#5B6B78" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif" ><tspan x="452" dy="0">Online → HTTPS API</tspan><tspan x="452" dy="21.25">Offline → phone capability</tspan></text>
<text x="802" y="471" fill="#8A5600" font-size="23" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="802" dy="0">Small local model</tspan></text>
