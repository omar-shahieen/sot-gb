<text x="118" y="711" fill="#C8381F" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif" ><tspan x="118" dy="0">Saved contacts</tspan><tspan x="118" dy="21.25">Emergency SMS + GPS</tspan></text>
<text x="452" y="300" fill="#0B7A83" font-size="23" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="452" dy="0">BLE + signal prep</tspan></text>
