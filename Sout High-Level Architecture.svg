<text x="1077" y="804" fill="#8A5600" font-size="16" font-family="Comic Sans MS, Segoe UI, sans-serif" ><tspan x="1077" dy="0">Versioned model files</tspan></text>
<text x="95" y="912" fill="#10212F" font-size="20" font-family="Comic Sans MS, Segoe UI, sans-serif" ><tspan x="95" dy="0">SAFE OFFLINE FALLBACK</tspan></text>
<text x="95" y="944" fill="#5B6B78" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif" ><tspan x="95" dy="0">Capable phone: limited local translation. Weak phone: favorites, emergency and channel check remain available.</tspan><tspan x="95" dy="21.25">Privacy: raw EMG/audio are encrypted in transit and not retained by default. F9/F10 content and text-to-sign are future extensions.</tspan></text>
