<path d="M710 400 L710 465" fill="none" stroke="#0B7A83" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-5)"/>
<defs><marker id="arrow-6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#B26A00" stroke-width="2"/></marker></defs>
<path d="M1580 400 L1580 465" fill="none" stroke="#B26A00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-6)"/>
<text x="70" y="76" fill="#10212F" font-size="38" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="70" dy="0">SOUT  /  Interfaces between systems</tspan></text>
<text x="70" y="117" fill="#5B6B78" font-size="21" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="70" dy="0">Contract map  •  documented exchanges and decisions to freeze</tspan></text>
<text x="95" y="220" fill="#0B7A83" font-size="25" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="95" dy="0">EMG ARMBAND</tspan></text>
<text x="95" y="261" fill="#10212F" font-size="19" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="95" dy="0">8-channel EMG stream</tspan><tspan x="95" dy="23.75">Battery + contact status</tspan><tspan x="95" dy="23.75">Pair / reconnect</tspan></text>
<text x="480" y="220" fill="#0B7A83" font-size="25" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="480" dy="0">SOUT PHONE APP</tspan></text>
<text x="480" y="261" fill="#10212F" font-size="19" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="480" dy="0">BLE + time-stamping</tspan><tspan x="480" dy="23.75">Preprocess + calibration</tspan><tspan x="480" dy="23.75">Mode selection + local fallback</tspan></text>
<text x="1010" y="220" fill="#2A4559" font-size="25" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="1010" dy="0">BACKEND</tspan></text>
<text x="1010" y="261" fill="#10212F" font-size="19" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1010" dy="0">HTTPS inference APIs</tspan><tspan x="1010" dy="23.75">Artifact hosting</tspan><tspan x="1010" dy="23.75">Latency / error monitoring</tspan></text>
<text x="1460" y="220" fill="#2A4559" font-size="25" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="1460" dy="0">AI TEAM</tspan></text>
<text x="1460" y="261" fill="#10212F" font-size="19" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1460" dy="0">Large sign model</tspan><tspan x="1460" dy="23.75">Small phone model</tspan><tspan x="1460" dy="23.75">Evaluated versions</tspan></text>
<text x="85" y="430" fill="#0B7A83" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="85" dy="0">BLE  ·  device stream</tspan></text>
<text x="780" y="430" fill="#0B7A83" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="780" dy="0">HTTPS  ·  inference</tspan></text>
<text x="1400" y="430" fill="#8A5600" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1400" dy="0">Validated artifacts</tspan></text>
<text x="95" y="511" fill="#0B7A83" font-size="24" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="95" dy="0">I1  /  BAND ↔ MOBILE</tspan></text>
<text x="95" y="548" fill="#10212F" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="95" dy="0">Payload: EMG samples, timestamps,</tspan><tspan x="95" dy="22.5">battery and per-channel contact quality.</tspan><tspan x="95" dy="22.5">Phone handles pairing and reconnect.</tspan></text>
<text x="95" y="658" fill="#8A5600" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="95" dy="0">TBD: sample rate, channel order,</tspan><tspan x="95" dy="21.25">scaling and IMU availability.</tspan></text>
<text x="660" y="511" fill="#0B7A83" font-size="24" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="660" dy="0">I2  /  MOBILE ↔ BACKEND</tspan></text>
<text x="660" y="548" fill="#10212F" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="660" dy="0">Sign: processed whole sentence + calibration</tspan><tspan x="660" dy="22.5">→ Egyptian Arabic text + optional confidence.</tspan><tspan x="660" dy="22.5">Speech: audio → Arabic text + quality.</tspan></text>
<text x="660" y="658" fill="#8A5600" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="660" dy="0">Drop/failure: show mode change;</tspan><tspan x="660" dy="21.25">fall back locally when capable.</tspan></text>
<text x="1265" y="511" fill="#8A5600" font-size="24" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="1265" dy="0">I3  /  MODEL DELIVERY</tspan></text>
<text x="1265" y="548" fill="#10212F" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1265" dy="0">AI → backend → phone:</tspan><tspan x="1265" dy="22.5">versioned small model, phrase list,</tspan><tspan x="1265" dy="22.5">checksum + minimum device capability.</tspan></text>
<text x="1265" y="658" fill="#8A5600" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1265" dy="0">TBD: artifact format and</tspan><tspan x="1265" dy="21.25">rollback metadata details.</tspan></text>
<text x="95" y="808" fill="#2A4559" font-size="24" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="95" dy="0">I4  /  PHONE ↔ OS  ·  LOCAL ONLY</tspan></text>
<text x="95" y="849" fill="#10212F" font-size="19" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="95" dy="0">Microphone, local speech recognizer, Arabic TTS, SMS and GPS.</tspan><tspan x="95" dy="23.75">History, favorites, emergency and calibration check need no backend.</tspan></text>
<text x="960" y="808" fill="#C8381F" font-size="24" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="960" dy="0">PRIVACY + OPEN CONTRACTS</tspan></text>
<text x="960" y="848" fill="#10212F" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="960" dy="0">Encrypt online EMG/audio; no raw retention without consent.</tspan><tspan x="960" dy="22.5">Freeze BLE schema, STT provider and phone capability threshold.</tspan><tspan x="960" dy="22.5">Login/auth service is not specified in the requirements.</tspan></text>
</svg>
