<path d="M895 722 L1015 722" fill="none" stroke="#B26A00" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-4)"/>
<text x="70" y="76" fill="#10212F" font-size="38" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="70" dy="0">SOUT  /  Backend API design</tspan></text>
<text x="70" y="117" fill="#5B6B78" font-size="21" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="70" dy="0">Logical API surface  •  exact routes and status codes not yet specified</tspan></text>
<text x="95" y="220" fill="#0B7A83" font-size="25" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="95" dy="0">ANDROID CLIENT</tspan></text>
<text x="475" y="220" fill="#0B7A83" font-size="25" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="475" dy="0">HTTPS API BOUNDARY</tspan></text>
<text x="1015" y="220" fill="#2A4559" font-size="25" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="1015" dy="0">BACKEND RUNTIME + ARTIFACTS</tspan></text>
<text x="115" y="292" fill="#0B7A83" font-size="23" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="115" dy="0">Online requests</tspan></text>
<text x="115" y="330" fill="#10212F" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="115" dy="0">Processed EMG sentence</tspan><tspan x="115" dy="22.5">+ user calibration</tspan><tspan x="115" dy="22.5"></tspan><tspan x="115" dy="22.5">Captured reply audio</tspan><tspan x="115" dy="22.5"></tspan><tspan x="115" dy="22.5">Versioned model lookup</tspan></text>
<text x="115" y="604" fill="#2A4559" font-size="23" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="115" dy="0">Local-only paths</tspan></text>
<text x="115" y="639" fill="#10212F" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="115" dy="0">Preview + Arabic TTS</tspan><tspan x="115" dy="22.5">History + favorites</tspan><tspan x="115" dy="22.5">Emergency SMS / GPS</tspan><tspan x="115" dy="22.5">Offline model inference</tspan></text>
<text x="495" y="284" fill="#0B7A83" font-size="22" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="495" dy="0">Entry guard + routing</tspan></text>
<text x="495" y="314" fill="#5B6B78" font-size="16" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="495" dy="0">HTTPS • schema/size/version validation</tspan></text>
<text x="495" y="399" fill="#0B7A83" font-size="22" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="495" dy="0">Sign translation</tspan></text>
<text x="495" y="428" fill="#10212F" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="495" dy="0">In: processed sentence + calibration</tspan><tspan x="495" dy="21.25">Out: Arabic text + optional confidence</tspan></text>
<text x="495" y="549" fill="#0B7A83" font-size="22" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="495" dy="0">Speech-to-text  ·  F5</tspan></text>
<text x="495" y="578" fill="#10212F" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="495" dy="0">In: captured audio</tspan><tspan x="495" dy="21.25">Out: Arabic text + quality indication</tspan></text>
<text x="495" y="699" fill="#8A5600" font-size="22" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="495" dy="0">Model artifact delivery</tspan></text>
<text x="495" y="728" fill="#10212F" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="495" dy="0">Versioned download + phrase list</tspan><tspan x="495" dy="21.25">checksum / min capability / rollback</tspan></text>
<text x="1035" y="399" fill="#2A4559" font-size="22" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="1035" dy="0">Sign inference service</tspan></text>
<text x="1035" y="432" fill="#5B6B78" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1035" dy="0">Large server model</tspan><tspan x="1035" dy="21.25">whole-sentence inference</tspan></text>
<text x="1390" y="549" fill="#2A4559" font-size="22" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="1390" dy="0">Arabic STT service</tspan></text>
<text x="1390" y="582" fill="#5B6B78" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1390" dy="0">Hosted/proxied choice TBD</tspan><tspan x="1390" dy="21.25">model selected after testing</tspan></text>
<text x="1035" y="699" fill="#8A5600" font-size="22" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="1035" dy="0">Versioned artifact store</tspan></text>
<text x="1035" y="731" fill="#5B6B78" font-size="17" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="1035" dy="0">AI publishes validated model versions;</tspan><tspan x="1035" dy="21.25">phone downloads and checks compatibility.</tspan></text>
<text x="95" y="906" fill="#10212F" font-size="23" font-family="Comic Sans MS, Segoe UI, sans-serif" font-weight="700"><tspan x="95" dy="0">CROSS-CUTTING CONTRACT</tspan></text>
<text x="95" y="941" fill="#5B6B78" font-size="18" font-family="Comic Sans MS, Segoe UI, sans-serif"><tspan x="95" dy="0">Return explicit failures so the phone can switch modes; log latency, errors and model version—not conversation content.</tspan><tspan x="95" dy="22.5">No server API for local history, favorites or emergency. Auth, feedback upload, exact paths/status codes and consent storage are TBD.</tspan></text>
